name: Publish to npm

# Uses npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN.
# Configure each package on npmjs.com → Settings → Trusted Publisher:
#   Organization/user: igorls
#   Repository:        angular-translation-service
#   Workflow filename: publish.yml
#   Allowed actions:   npm publish
#
# Docs: https://docs.npmjs.com/trusted-publishers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC → npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 22.14+ and npm 11.5.1+ required for trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish core library
        run: |
          VERSION=$(node -p "require('./dist/core/package.json').version")
          if npm view "@angular-translation-service/core@${VERSION}" version >/dev/null 2>&1; then
            echo "core@${VERSION} already on npm — skipping"
          else
            # OIDC auth; provenance is automatic with trusted publishing
            cd dist/core && npm publish --access public
          fi

      - name: Publish CLI
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@angular-translation-service/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "cli@${VERSION} already on npm — skipping"
          else
            cd packages/cli && npm publish --access public
          fi
