<footer>
  <div class="container footer-inner">
    @let t = $any(common());
    @if (t) {
      <div class="footer-left">
        <span class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
        <span>{{ t.footer.built_with }}</span>
      </div>
      <div class="footer-right">
        <span>{{ t.footer.license }}</span>
        <span class="divider">·</span>
        <span>{{ t.footer.copyright }}</span>
      </div>
    }
  </div>
</footer>
